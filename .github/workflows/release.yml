name: Release

permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode signing key
        run: |
          printf '%s' "${{ secrets.SIGNING_KEY }}" | base64 --decode > "$HOME/signing_key.jks"
          test -s "$HOME/signing_key.jks"

      - name: Build Android APK
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            ./gradlew assembleRelease --warning-mode all
          else
            ./gradlew assembleAlpha --warning-mode all
          fi
        env:
          storyteller_f_sign_key: ${{ secrets.SIGNING_KEY }}
          storyteller_f_sign_alias: ${{ secrets.ALIAS }}
          storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
          storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Upload alpha APK
        if: ${{ !(github.event_name == 'release') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summer-alpha
          path: app/build/outputs/apk/alpha/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: (github.event_name == 'release')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    if: (github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: summer-release
          path: release-assets

      - name: Upload release assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
